[project]
name = "moliterate"
version = "0.1.0"
description = "iterate over molecules with properties"
readme = "README.md"
authors = [{ name = "Giulio Benedini", email = "benedini@scm.com" }]
keywords = ["chemistry", "machine learning", "datasets"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.4",
    "ase>=3.23.0",
    "pydantic>=2.10.6",
    "scipy>=1.10.1",
    "tqdm>=4.67.1",
    "typing-extensions>=4.13.2",
]

[project.optional-dependencies]
chem = ["plams>=2025.104", "dscribe>=2.1.1"]
mace = ["mace-torch>=0.3.14"]
apricot = ["apricot-select>=0.6.1", "scikit-learn>=1.3.2"]
tutorial = ["jupyterlab>=4.3.8"]
viz = [
    "marimo>=0.8.22",
    "matplotlib>=3.7.5",
    "py3Dmol>=2.4.2",
    "wigglystuff>=0.1.14",
]
ams = [
    "cma>=4.4.4",
    "scm-base",
    "scm-params",
    "scm-utils",
    "scm-conformers",
]

[[tool.uv.index]]
name = "scm"
url = "https://downloads.scm.com/Downloads/packages/uv/channels/2026.1/simple/"
default = false

[project.scripts]
moliterate = "scm.moliterate.__main__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scm"]

[dependency-groups]
dev = ["coverage>=7.6.1", "pytest>=8.3.5", "ruff>=0.14.10", "testbook>=0.4.2"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
# Core linting + import sorting
select = [
    # pycodestyle
    "E",
    # Pyflakes
    # "F",
    # pyupgrade
    # "UP",
    # flake8-bugbear
    # "B",
    # flake8-simplify
    # "SIM",
    # isort
    "I",
]
